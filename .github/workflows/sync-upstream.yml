name: Sync Upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Pouzor/homelable.git
          git fetch upstream main

      - name: Merge upstream into main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge upstream/main --ff-only; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Fork main has diverged from upstream and cannot be fast-forwarded. Rebase or merge upstream/main into your local main, then push to resolve."
            exit 1
          fi

      - name: Push
        run: git push origin main
